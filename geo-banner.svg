<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Ananda Gunawan — GeoAI, GIS, Urban Analytics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="45%" stop-color="#0c1c26"/>
      <stop offset="100%" stop-color="#0a2a34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3ef2a1"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ef2a1" stop-opacity="0"/>
      <stop offset="60%" stop-color="#3ef2a1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ef2a1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ef2a1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ef2a1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2de1c2" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>

  <style>
    .drift   { animation: drift 14s linear infinite; }
    .spin    { animation: spin 6s linear infinite; transform-origin: 838px 140px; }
    .scanbar { animation: scanx 7s ease-in-out infinite; }
    .draw    { stroke-dasharray: 1400; animation: draw 6s ease-in-out infinite backwards; }
    .draw2   { animation-delay: .9s; }
    .draw3   { animation-delay: 1.8s; }
    .pulse   { animation: pulse 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: .5s } .p3 { animation-delay: 1s } .p4 { animation-delay: 1.5s } .p5 { animation-delay: 2s }
    .rise    { animation: rise .9s cubic-bezier(.2,.7,.3,1) backwards; }
    .r2 { animation-delay: .25s } .r3 { animation-delay: .5s } .r4 { animation-delay: .75s }
    .flow    { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    .blink   { animation: blink 1.1s steps(2) infinite; }
    .float   { animation: float 5s ease-in-out infinite; }

    @keyframes drift  { to { transform: translate(-42px, -42px); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes scanx  { 0%,100% { transform: translateX(-320px); } 50% { transform: translateX(1020px); } }
    @keyframes draw   { 0% { stroke-dashoffset: 1400; } 45%,60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1400; } }
    @keyframes pulse  { 0% { transform: scale(.6); opacity: 1 } 70% { transform: scale(2.6); opacity: 0 } 100% { opacity: 0 } }
    @keyframes rise   { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes flow   { to { stroke-dashoffset: -32; } }
    @keyframes blink  { 50% { opacity: 0 } }
    @keyframes float  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <g class="drift"><rect x="-60" y="-60" width="1140" height="420" fill="url(#grid)"/></g>

    <!-- kontur / isoline -->
    <g fill="none" stroke="url(#accent)" stroke-width="1.6" opacity="0.5" stroke-linecap="round">
      <path class="draw"  d="M-20 210 C 120 160, 220 250, 360 196 S 620 150, 760 205 S 960 240, 1020 190"/>
      <path class="draw draw2" d="M-20 238 C 140 196, 250 272, 400 224 S 640 182, 800 232 S 980 262, 1020 220"/>
      <path class="draw draw3" d="M-20 182 C 100 132, 230 214, 380 158 S 600 118, 740 172 S 950 206, 1020 158"/>
    </g>

    <!-- radar -->
    <g class="float">
      <circle cx="838" cy="140" r="84" fill="none" stroke="#3ef2a1" stroke-opacity=".22"/>
      <circle cx="838" cy="140" r="56" fill="none" stroke="#3ef2a1" stroke-opacity=".18"/>
      <circle cx="838" cy="140" r="28" fill="none" stroke="#3ef2a1" stroke-opacity=".14"/>
      <circle cx="838" cy="140" r="84" fill="none" stroke="#00e5ff" stroke-opacity=".35" class="flow"/>
      <g class="spin">
        <path d="M838 140 L922 140 A84 84 0 0 0 880 67 Z" fill="url(#glow)"/>
        <line x1="838" y1="140" x2="922" y2="140" stroke="#3ef2a1" stroke-width="1.6"/>
      </g>
      <circle cx="838" cy="140" r="3" fill="#3ef2a1"/>
      <g fill="#3ef2a1">
        <circle cx="880" cy="106" r="3.4"/><circle cx="880" cy="106" r="5" class="pulse" fill="none" stroke="#3ef2a1"/>
        <circle cx="796" cy="176" r="3.4"/><circle cx="796" cy="176" r="5" class="pulse p2" fill="none" stroke="#3ef2a1"/>
        <circle cx="866" cy="188" r="3.4"/><circle cx="866" cy="188" r="5" class="pulse p3" fill="none" stroke="#3ef2a1"/>
      </g>
    </g>

    <!-- titik data tersebar -->
    <g fill="#00e5ff">
      <circle cx="120" cy="96" r="3"/><circle cx="120" cy="96" r="5" class="pulse p2" fill="none" stroke="#00e5ff"/>
      <circle cx="268" cy="62" r="3"/><circle cx="268" cy="62" r="5" class="pulse p4" fill="none" stroke="#00e5ff"/>
      <circle cx="612" cy="74" r="3"/><circle cx="612" cy="74" r="5" class="pulse p5" fill="none" stroke="#00e5ff"/>
      <circle cx="470" cy="240" r="3"/><circle cx="470" cy="240" r="5" class="pulse p3" fill="none" stroke="#00e5ff"/>
    </g>

    <!-- teks -->
    <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <text x="64" y="106" class="rise" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="1.5">ANANDA GUNAWAN</text>
      <text x="66" y="146" class="rise r2" fill="url(#accent)" font-size="19" font-weight="600" letter-spacing="4.2">GeoAI · GIS · URBAN ANALYTICS</text>
      <g class="rise r3" font-size="13" fill="#7fe7d2" letter-spacing="1.2">
        <text x="66" y="180">spatial data quality · open geodata · remote sensing · python</text>
      </g>
      <g class="rise r4">
        <rect x="64" y="200" width="152" height="26" rx="13" fill="none" stroke="#3ef2a1" stroke-opacity=".45"/>
        <circle cx="82" cy="213" r="4" fill="#3ef2a1" class="blink"/>
        <text x="94" y="217" fill="#9beccd" font-size="12" letter-spacing="1.4">BUILDING GeoQC</text>
      </g>
    </g>

    <g class="scanbar"><rect x="0" y="0" width="300" height="280" fill="url(#scan)"/></g>
    <rect x="0.5" y="0.5" width="999" height="279" rx="20" fill="none" stroke="#3ef2a1" stroke-opacity=".28"/>
  </g>
</svg>
