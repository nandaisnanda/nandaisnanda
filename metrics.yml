name: Metrics

on:
  schedule:
    - cron: "0 21 * * *"   # tiap hari 04:00 WIB
  workflow_dispatch:        # tombol Run workflow manual
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Pakai METRICS_TOKEN kalau sudah dibuat (hasil lebih lengkap).
          # Kalau belum, ganti baris di bawah jadi: token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.METRICS_TOKEN }}
          user: nandaisnanda
          filename: metrics.svg
          committer_branch: main

          base: header, activity, repositories, metadata
          config_timezone: Asia/Jakarta

          # bahasa pemrograman terbanyak
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # kalender kontribusi setahun
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
