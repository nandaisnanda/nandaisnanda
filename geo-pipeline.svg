<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Alur kerja GeoAI: Geodata, Quality Control, Feature, Model, Insight">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0a2a34"/>
    </linearGradient>
    <linearGradient id="pline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3ef2a1"/>
    </linearGradient>
    <clipPath id="pframe"><rect width="1000" height="170" rx="18"/></clipPath>
    <path id="track" d="M110 92 H290 H470 H650 H830"/>
  </defs>

  <style>
    .rail  { stroke-dasharray: 5 9; animation: rail 1.2s linear infinite; }
    .node  { animation: lit 5s ease-in-out infinite; }
    .n2 { animation-delay: 1s } .n3 { animation-delay: 2s } .n4 { animation-delay: 3s } .n5 { animation-delay: 4s }
    .halo  { animation: halo 5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .h2 { animation-delay: 1s } .h3 { animation-delay: 2s } .h4 { animation-delay: 3s } .h5 { animation-delay: 4s }
    .cap   { animation: fade 5s ease-in-out infinite; }
    .c2 { animation-delay: 1s } .c3 { animation-delay: 2s } .c4 { animation-delay: 3s } .c5 { animation-delay: 4s }
    @keyframes rail { to { stroke-dashoffset: -28 } }
    @keyframes lit  { 0%,8% { stroke: #3ef2a1; stroke-width: 2.4 } 22%,100% { stroke: #2de1c2; stroke-width: 1.2 } }
    @keyframes halo { 0% { transform: scale(.7); opacity: .8 } 30% { transform: scale(1.9); opacity: 0 } 100% { opacity: 0 } }
    @keyframes fade { 0%,8% { fill: #eafff6 } 25%,100% { fill: #6fc9bb } }
  </style>

  <g clip-path="url(#pframe)">
    <rect width="1000" height="170" fill="url(#pbg)"/>
    <rect x="0.5" y="0.5" width="999" height="169" rx="18" fill="none" stroke="#3ef2a1" stroke-opacity=".25"/>

    <line x1="110" y1="92" x2="890" y2="92" stroke="url(#pline)" stroke-opacity=".28" stroke-width="2"/>
    <line x1="110" y1="92" x2="890" y2="92" stroke="#3ef2a1" stroke-width="2" class="rail"/>

    <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" letter-spacing="1.6">
      <g transform="translate(110,92)">
        <circle r="24" fill="#0b1a22" stroke="#2de1c2" class="node"/>
        <circle r="24" fill="none" stroke="#3ef2a1" class="halo"/>
        <text y="5" fill="#3ef2a1" font-size="16">◍</text>
        <text y="56" class="cap">GEODATA</text>
      </g>
      <g transform="translate(305,92)">
        <circle r="24" fill="#0b1a22" stroke="#2de1c2" class="node n2"/>
        <circle r="24" fill="none" stroke="#3ef2a1" class="halo h2"/>
        <text y="5" fill="#3ef2a1" font-size="16">✓</text>
        <text y="56" class="cap c2">QUALITY CONTROL</text>
      </g>
      <g transform="translate(500,92)">
        <circle r="24" fill="#0b1a22" stroke="#2de1c2" class="node n3"/>
        <circle r="24" fill="none" stroke="#3ef2a1" class="halo h3"/>
        <text y="5" fill="#3ef2a1" font-size="16">▦</text>
        <text y="56" class="cap c3">FEATURES</text>
      </g>
      <g transform="translate(695,92)">
        <circle r="24" fill="#0b1a22" stroke="#2de1c2" class="node n4"/>
        <circle r="24" fill="none" stroke="#3ef2a1" class="halo h4"/>
        <text y="5" fill="#3ef2a1" font-size="16">◆</text>
        <text y="56" class="cap c4">GeoAI MODEL</text>
      </g>
      <g transform="translate(890,92)">
        <circle r="24" fill="#0b1a22" stroke="#2de1c2" class="node n5"/>
        <circle r="24" fill="none" stroke="#3ef2a1" class="halo h5"/>
        <text y="5" fill="#3ef2a1" font-size="16">★</text>
        <text y="56" class="cap c5">URBAN INSIGHT</text>
      </g>
      <text x="500" y="34" fill="#5fb8ad" font-size="11" letter-spacing="4">END-TO-END SPATIAL WORKFLOW</text>
    </g>

    <g>
      <circle r="5.5" fill="#eafff6">
        <animateMotion dur="5s" repeatCount="indefinite" path="M110 92 H890"/>
      </circle>
      <circle r="11" fill="none" stroke="#3ef2a1" stroke-opacity=".55">
        <animateMotion dur="5s" repeatCount="indefinite" path="M110 92 H890"/>
      </circle>
    </g>
  </g>
</svg>
